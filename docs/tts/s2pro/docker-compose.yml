services:
  s2cpp:
    image: s2cpp:latest
    container_name: s2cpp-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "3030:3030"
    volumes:
      - ${USERPROFILE}/.cache/huggingface/hub/models--rodrigomt--s2-pro-gguf/snapshots/a7320690b5585b03b20ed6484b55926f3015f48d:/app/models      # .gguf model file directory
      - ./voices:/app/voices      # .s2voice voice profile directory
    environment:
      MODEL_PATH: /app/models/s2-pro-q6_k.gguf   # Change to your model filename
      HOST:       0.0.0.0
      PORT:       3030
      GPU_LAYERS: -1       # -1 = auto; set specific integer to limit GPU layers and save VRAM
      THREADS:    0        # 0 = auto-detect CPU cores
      LOG_LEVEL:  info
      # EXTRA_ARGS: --codec-cpu --gpu-layers 18   # Uncomment if GPU VRAM is insufficient

    restart: unless-stopped
    stdin_open: false
    tty:    false
    healthcheck:
      disable: true
