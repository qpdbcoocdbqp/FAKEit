services:
  whisper:
    image: vllm/vllm-openai:v0.23.0-ubuntu2404
    container_name: vllm-whisper
    runtime: nvidia
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "18000:8000"
    entrypoint: ["/bin/bash", "-c"]
    command: 
      - |
        pip install av librosa soundfile &&
        vllm serve openai/whisper-large-v3-turbo \
        --host 0.0.0.0 \
        --port 8000 \
        --gpu-memory-utilization 0.3 \
        --max-model-len 448
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]