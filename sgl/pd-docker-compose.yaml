services:
  sglang-chat-prefill:
    image: lmsysorg/sglang:${SGLANG_PD_TAG:-latest-runtime}
    container_name: sglang-chat-prefill
    volumes:
      - hf_cache:/root/.cache/huggingface
      - fi_cache:/root/.cache/flashinfer
      - tt_cache:/root/.triton
    restart: always
    privileged: false
    entrypoint: python3 -m sglang.launch_server
    command: >
      --model-path /root/.cache/huggingface/hub/models--google--gemma-3-270m-it/snapshots/ac82b4e820549b854eebf28ce6dedaf9fdfa17b3
      --disaggregation-mode prefill
      --host 0.0.0.0
      --port 30000
      --attention-backend flashinfer
      --dtype bfloat16
      --mem-fraction-static 0.08
      --max-total-tokens 2048
      --max-prefill-tokens 512
      --chunked-prefill-size 512
      --trust-remote-code
      --disable-cuda-graph
      --enable-metrics
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - sglang-network

  sglang-chat-decode:
    image: lmsysorg/sglang:${SGLANG_PD_TAG:-latest-runtime}
    container_name: sglang-chat-decode
    volumes:
      - hf_cache:/root/.cache/huggingface
      - fi_cache:/root/.cache/flashinfer
      - tt_cache:/root/.triton
    restart: always
    privileged: false
    entrypoint: python3 -m sglang.launch_server
    command: >
      --model-path /root/.cache/huggingface/hub/models--google--gemma-3-270m-it/snapshots/ac82b4e820549b854eebf28ce6dedaf9fdfa17b3
      --disaggregation-mode decode
      --host 0.0.0.0
      --port 30000
      --attention-backend flashinfer
      --dtype bfloat16
      --mem-fraction-static 0.08
      --max-total-tokens 2048
      --max-prefill-tokens 512
      --chunked-prefill-size 512
      --trust-remote-code
      --disable-cuda-graph
      --enable-metrics
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - sglang-network

  sglang-chat-router:
    image: lmsysorg/sglang:${SGLANG_PD_TAG:-latest-runtime}
    container_name: sglang-chat-router
    restart: always
    privileged: false
    ports:
      - 30000:30000
      - 29000:29000
    entrypoint: python3 -m sglang_router.launch_router
    command: >
      --pd-disaggregation
      --prefill http://sglang-chat-prefill:30000
      --decode http://sglang-chat-decode:30000
      --host 0.0.0.0
      --port 30000
      --prometheus-host 0.0.0.0
      --prometheus-port 29000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
    depends_on:
      sglang-chat-prefill:
        condition: service_healthy
      sglang-chat-decode:
        condition: service_healthy
    networks:
      - sglang-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./deployments/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - sglang-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - ./deployments/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./deployments/grafana/dashboards/config:/etc/grafana/provisioning/dashboards
      - ./deployments/grafana/dashboards/json:/var/lib/grafana/dashboards
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_BASIC_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/sglang-dashboard.json
    depends_on:
      - prometheus
    networks:
      - sglang-network

volumes:
  hf_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.cache/huggingface
  fi_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: volume/flashinfer
  tt_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: volume/triton

networks:
  sglang-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16