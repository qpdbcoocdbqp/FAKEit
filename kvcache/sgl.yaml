services:
  lmcache-server:
    image: lmcache/vllm-openai:latest
    container_name: lmcache-server
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - LMCACHE_LOCAL_CPU=True
      - LMCACHE_MAX_LOCAL_CPU_SIZE=2
    ipc: host
    ports:
      - 6555:6555
    entrypoint: []
    command: >-
      python3 -m lmcache.v1.multiprocess.http_server
      --l1-size-gb 1
      --eviction-policy LRU
      --max-workers 1
      --host 0.0.0.0
      --port 6555
      --http-port 8080
      --supported-transfer-mode engine_driven
    networks:
      - lmcache-net

  sgl-serve:
    image: lmsysorg/sglang:v0.5.13.post1-runtime
    container_name: sgl-serve
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ipc: host
    ports:
      - 18002:8000
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./lmcache_config.yaml:/etc/lmcache/lmcache_config.yaml:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - -c
      - >-
        python3 -m pip install --no-cache-dir distro lmcache && exec python3 -m sglang.launch_server
        --model-path Qwen/Qwen3-0.6B
        --enable-lmcache
        --lmcache-config-file /etc/lmcache/lmcache_config.yaml
        --mem-fraction-static 0.3
        --context-length 3096
        --max-running-requests 1
    depends_on:
      - lmcache-server
    networks:
      - lmcache-net

networks:
  lmcache-net:
    driver: bridge
