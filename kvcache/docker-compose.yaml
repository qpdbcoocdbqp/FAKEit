services:
  # ============================================================
  # LMCache serving stack
  # ============================================================

  lmcache-server:
    image: lmcache/vllm-openai:latest
    container_name: lmcache-server
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - LMCACHE_LOCAL_CPU=True
      - LMCACHE_MAX_LOCAL_CPU_SIZE=2
    ipc: host
    ports:
      - 18000:8080
      - 6555:6555
    entrypoint: []
    command: >
      python3 -m lmcache.v1.multiprocess.http_server --l1-size-gb 1 --eviction-policy LRU --max-workers 1 --host 0.0.0.0 --port 6555 --http-port 8080
      --enable-tracing --otlp-endpoint http://otel-collector:4317
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/healthcheck || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lmcache-net
    depends_on:
      - otel-collector

  vllm-serve:
    image: lmcache/vllm-openai:latest
    container_name: vllm-serve
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
    ipc: host
    ports:
      - 18001:8000
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      Qwen/Qwen3-0.6B --gpu-memory-utilization 0.3 --max-model-len 2048 --max-num-seqs 1 --kv-transfer-config '{"kv_connector":"LMCacheMPConnector", "kv_role":"kv_both", "kv_connector_extra_config": {"lmcache.mp.host": "tcp://lmcache-server", "lmcache.mp.port": 6555, "lmcache.mp.mq_timeout": 10, "lmcache.mp.mp_transfer_mode": "engine_driven"}}'
    depends_on:
      - lmcache-server
    networks:
      - lmcache-net

  # ============================================================
  # Observability stack
  # ============================================================

  # OTel Collector — receives OTLP from LMCache, fans out to Tempo + Prometheus
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: obs_otel_collector
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel-collector.yml:ro
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "4320:4317"   # OTLP gRPC (LMCache sends here)
      - "8889:8889"   # Prometheus scrape endpoint
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tempo
    networks:
      - lmcache-net
    restart: unless-stopped

  # Tempo — trace storage
  tempo:
    image: grafana/tempo:2.7.2
    container_name: obs_tempo
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
    networks:
      - lmcache-net
    restart: unless-stopped

  # Prometheus — metrics storage
  prometheus:
    image: prom/prometheus:latest
    container_name: obs_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector
    networks:
      - lmcache-net
    restart: unless-stopped

  # Grafana — UI (anonymous access, no login required)
  grafana:
    image: grafana/grafana:latest
    container_name: obs_grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - prometheus
      - tempo
    networks:
      - lmcache-net
    restart: unless-stopped

networks:
  lmcache-net:
    driver: bridge

volumes:
  tempo_data:
  prometheus_data:
  grafana_data: